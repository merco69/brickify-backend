services:
  - type: web
    name: brickify-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: brickify-db
          property: connectionString

  - type: web
    name: brickify-ai
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8001